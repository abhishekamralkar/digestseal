name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: '1.100.0'

jobs:
  checks:
    name: Checks on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +"$RUST_VERSION" fmt --all -- --check
      - name: Run Clippy
        run: cargo +"$RUST_VERSION" clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo +"$RUST_VERSION" test --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with the Rust version declared in Cargo.toml
        run: |
          msrv=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "digestseal") | .rust_version')
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" test --locked

  audit:
    name: RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Install cargo-audit
        run: cargo +"$RUST_VERSION" install --locked cargo-audit@0.23.0
      - name: Audit locked dependencies
        run: cargo +"$RUST_VERSION" audit
