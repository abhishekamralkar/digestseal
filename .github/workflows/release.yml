name: Release binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RUST_VERSION: '1.100.0'

jobs:
  validate:
    name: Validate release tag
    if: github.event.created
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal
      - name: Check tag against Cargo version
        run: |
          version=$(cargo +"$RUST_VERSION" metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "digestseal") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo version v$version." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
      - name: Build and test
        env:
          BINARY: ${{ runner.os == 'Windows' && 'digestseal.exe' || 'digestseal' }}
        run: |
          cargo +"$RUST_VERSION" test --release --locked --target "$TARGET"
          cargo +"$RUST_VERSION" build --release --locked --target "$TARGET"
          "./target/$TARGET/release/$BINARY" --version
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          archive="digestseal-${GITHUB_REF_NAME/+/_}-$TARGET.tar.gz"
          mkdir -p package dist
          cp "target/$TARGET/release/digestseal" LICENSE package/
          COPYFILE_DISABLE=1 tar -czf "dist/$archive" -C package digestseal LICENSE
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.Replace('+', '_')
          $archive = "digestseal-$tag-${env:TARGET}.zip"
          New-Item -ItemType Directory -Path package, dist
          Copy-Item "target/$env:TARGET/release/digestseal.exe", LICENSE -Destination package
          Compress-Archive -Path package/* -DestinationPath "dist/$archive"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digestseal-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digestseal-*
          merge-multiple: true
          path: dist
      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/digestseal-*
      - name: Generate checksums and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archives=(digestseal-*)
          sha256sum -- "${archives[@]}" > SHA256SUMS

          args=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" "${archives[@]}" SHA256SUMS
