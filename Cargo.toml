[package]
name = "digestseal"
version = "0.1.0"
edition = "2024"
description = "Sign OCI images once and reuse the detached signature"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519 = { version = "3", features = ["zeroize"] }
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem"] }
getrandom = { version = "0.4", features = ["std", "sys_rng"] }
hex = "0.4"
http-auth = { version = "0.1.10", default-features = false }
ml-dsa = { version = "0.1.2", features = ["zeroize"] }
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
pkcs8 = { version = "0.11", features = ["pem", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zeroize = "1"
